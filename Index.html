<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oghara Book a Ride</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #ddd;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .hero p {
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      max-width: 400px;
      margin: auto;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .ride {
      background: #111;
      color: white;
    }

    .driver {
      background: #e9ecef;
      color: #111;
    }

    .section {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-box {
      background: white;
      padding: 22px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .form-box h3 {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .submit {
      background: #111;
      color: white;
      margin-top: 18px;
    }

    .verification {
      background: #fff3cd;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>Oghara Book a Ride</h1>
  <p>Connecting Oghara with ease</p>
</header>

<section class="hero">
  <h2>Need a Ride?</h2>

  <p>
    Book a trusted local ride in Oghara quickly and conveniently.
    Safe, simple and designed for our community.
  </p>

  <div class="buttons">
    <button class="ride" onclick="showBooking()">🚗 Book a Ride</button>

    <button class="driver" onclick="showDriver()">🧑‍✈️ Become a Driver</button>
  </div>
</section>

<section class="section">

  <!-- BOOKING FORM -->

  <div class="form-box" id="bookingForm" style="display:none;">

    <h3>🚗 Book Your Ride</h3>

    <label>Passenger Name</label>
    <input type="text" id="passengerName" placeholder="Enter your name">

    <label>Phone Number</label>
    <input type="tel" id="passengerPhone" placeholder="08012345678">

    <label>Pickup Location</label>
    <input type="text" id="pickup" placeholder="Where should we pick you up?">

    <label>Destination</label>
    <input type="text" id="destination" placeholder="Where are you going?">

    <label>Ride Type</label>
    <select id="rideType">
      <option value="Car">Car</option>
      <option value="Tricycle">Tricycle</option>
      <option value="Motorcycle">Motorcycle</option>
    </select>

    <button class="submit" onclick="sendRide()">
      Send Ride Request on WhatsApp
    </button>

  </div>


  <!-- DRIVER FORM -->

  <div class="form-box" id="driverForm" style="display:none;">

    <h3>🧑‍✈️ Driver Registration</h3>

    <label>Full Name</label>
    <input type="text" id="driverName" placeholder="Enter your full name">

    <label>Phone Number</label>
    <input type="tel" id="driverPhone" placeholder="08012345678">

    <label>Vehicle Type</label>
    <select id="vehicleType">
      <option value="Car">Car</option>
      <option
